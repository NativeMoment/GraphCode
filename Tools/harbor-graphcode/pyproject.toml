[project]
name = "harbor-graphcode"
version = "0.1.0"
description = "GraphCode goal loops as a Harbor installed agent, for private Terminal-Bench trials"
requires-python = ">=3.12"
dependencies = [
    "harbor @ git+https://github.com/harbor-framework/harbor@09e555a148f7c0c9995341513efda18449645a5e",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["harbor_graphcode"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
